name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Quarto CLI
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 3. Setup R environment
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # 4. Install R dependencies (Directly targeting your patched fork)
      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::hanteng/babelquarto

      # 5. Verify Versions
      - name: Verify Versions
        run: |
          quarto --version
          Rscript -e 'cat("babelquarto version:", as.character(packageVersion("babelquarto")), "\n")'

      # 6. Audit File Manifest
      - name: 🔍 Audit File Manifest on Linux Runner
        run: python3 py-audit_manifest.py

      # 7. Render Multilingual Book using patched babelquarto
      - name: Render Multilingual Book
        run: |
          Rscript -e 'unlink("_book", recursive = TRUE); babelquarto::render_book()'

      # 8. Copy Cover Image
      - name: Copy Cover Image
        run: |
          cp cover.png _book/ || true

      # 9. Upload Pages Artifact
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_book'

      # 10. Deploy Artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4