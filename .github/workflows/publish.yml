name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Quarto CLI
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 3. Setup R environment
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # 4. Install R dependencies
      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::babelquarto
          packages: |
            github::ropensci-review-tools/babelquarto
            
      # Pin Quarto CLI to match your local 1.9.36 version
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.36"
      - name: Print Quarto Path and Version
        run: |
          quarto --version
          which quarto
      - name: Verify Versions
        run: |
          quarto --version
          Rscript -e 'cat("babelquarto version:", as.character(packageVersion("babelquarto")), "\n")'
      # 5. Render Multilingual Book using babelquarto
      - name: Render Multilingual Book
        run: |
          Rscript -e 'unlink("_book", recursive = TRUE); babelquarto::render_book()'

      # 6. Copy Cover Image if not included in resources
      - name: Copy Cover Image
        run: |
          cp cover.png _book/ || true

      # 7. Upload Pages Artifact
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_book'

      # 8. Deploy Artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
