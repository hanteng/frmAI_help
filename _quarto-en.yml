encoding: "UTF-8"
lang: en
language: _language-en.yml

project:
  type: book
  resources:
    - CNAME               # Added to ensure your domain file is kept during rendering
  render:
    - "*.en.qmd"
    - "**/*.en.qmd"
  output-dir: _book
book:
  title: "Harnessing Intelligence"
  subtitle: "AI Game Playbook"
  page-footer:
    left: |
      🙶Harnessing Intelligence: AI Game Playbook🙷 
      © Han-Teng Liao
    right: |
      aka 🙶The Tao of Intelligence: AI Game Playbook🙷 
      Built with <a href="https://quarto.org/">Quarto</a>.

format:
  html:
    lang: en                           # 確保英文配置下 HTML 語系正確
    css: styles.css
    theme:
      - zephyr
      - styles-en.scss
    toc: true
    toc-location: right
    number-sections: true
    number-depth: 4
    grid:
      sidebar-width: 330px
      body-width: 850px
      margin-width: 260px
      gutter-width: 1.5rem
    toc-title: "〜📖 On This Page 📑〜"
    crossref-nte-prefix: "Note"
    crossref-nte-title: "Note"
    crossref-tip-prefix: "Tip"
    crossref-tip-title: "Tip"
    callout-important-title: "Important"
