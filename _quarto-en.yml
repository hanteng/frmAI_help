encoding: "UTF-8"
lang: en

format:
  html:
    lang: en                           # 確保英文配置下 HTML 語系正確
    css: styles.css
    theme:
      - zephyr
      - styles-en.scss
    toc: true
    toc-location: right
    number-sections: true
    number-depth: 4
    grid:
      sidebar-width: 330px
      body-width: 850px
      margin-width: 260px
      gutter-width: 1.5rem
    toc-title: "〜📖 On This Page 📑〜"
    section-title-appendices: "🔖 Appendices & Notes"
    crossref-nte-prefix: "Note"
    crossref-nte-title: "Note"
    crossref-tip-prefix: "Tip"
    crossref-tip-title: "Tip"
    callout-important-title: "Important"